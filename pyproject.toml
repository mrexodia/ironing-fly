[project]
name = "ironing-fly"
version = "0.1.0"
description = "A real BANC fly circuit driving a reproducible virtual ironing experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
